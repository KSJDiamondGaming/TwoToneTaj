name: Release Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 1.0.0"
        required: true
        type: string
      deploy_production:
        description: "Deploy this release to production after creating it"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: twotonetaj-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full project check
        run: npm run check

  tag_release:
    name: Create release tag
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          TAG="v${RELEASE_VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Choose a new version."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "TwoToneTaj production release $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "TwoToneTaj $TAG" \
            --notes "Production release for TwoToneTaj $TAG."

  deploy:
    name: Deploy release to production
    needs: tag_release
    if: ${{ inputs.deploy_production }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://twotonetaj.ksjdigital.co.uk

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/twotonetaj_release
          chmod 600 ~/.ssh/twotonetaj_release
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tagged release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PORT="${VPS_PORT:-22}"
          TAG="v${RELEASE_VERSION}"

          ssh \
            -i ~/.ssh/twotonetaj_release \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -Eeuo pipefail
             cd /home/twotonetaj/site
             DEPLOY_REF='$TAG' bash scripts/deploy-vps.sh"

      - name: Release summary
        run: |
          echo "## TwoToneTaj release deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production: https://twotonetaj.ksjdigital.co.uk" >> "$GITHUB_STEP_SUMMARY"
