name: Validate TwoToneTaj

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-twotonetaj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, validate merch, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full project check
        run: npm run check
