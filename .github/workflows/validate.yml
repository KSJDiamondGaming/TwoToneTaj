name: Validate TwoToneTaj

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, validate merch, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        id: lint
        continue-on-error: true
        run: npm run lint > lint-output.txt 2>&1

      - name: Upload lint report
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: |
          cat lint-output.txt
          exit 1

      - name: Validate merch data
        run: npm run validate:merch

      - name: Build production bundle
        run: npm run build
